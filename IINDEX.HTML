<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ultimate Game Show Live - Phone Controller</title>
  <script src="peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #fff; text-align: center; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 16px; }
    .header { width: 100%; max-width: 400px; margin-bottom: 12px; }
    .logo-svg { width: 180px; height: auto; margin: 0 auto; display: block; }
    
    /* Login Form */
    #join-card { background: #1e293b; border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .input-field { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; text-align: center; }
    
    /* High-Contrast Neon Yellow Join Button */
    .btn-join { width: 100%; padding: 16px; margin-top: 12px; border: none; border-radius: 10px; background-color: #FFCC00; color: #000000; font-size: 1.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; box-shadow: 0 4px 14px rgba(255, 204, 0, 0.4); }
    .btn-join:active { transform: scale(0.98); background-color: #e6b800; }

    /* Controller Workspace */
    #controller-ui { display: none; width: 100%; max-width: 400px; flex-direction: column; align-items: center; gap: 16px; }
    
    /* Touch Wheel Canvas */
    .wheel-container { position: relative; width: 280px; height: 280px; margin: 10px auto; }
    canvas#touchWheel { width: 100%; height: 100%; border-radius: 50%; touch-action: none; background: #1e293b; box-shadow: 0 0 20px rgba(0,0,0,0.6); }

    /* Bonus Card Backing */
    .bonus-card { width: 100px; height: 140px; background: #1e293b; border: 2px solid #38bdf8; border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 8px; }
    
    .status-badge { font-size: 0.85rem; padding: 6px 12px; border-radius: 20px; background: #334155; color: #94a3b8; margin-top: 8px; }
    .status-badge.connected { background: #166534; color: #4ade80; }
  </style>
</head>
<body>

  <div class="header">
    <!-- SVG Logo -->
    <svg class="logo-svg" viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFE259"/>
          <stop offset="100%" stop-color="#FFA751"/>
        </linearGradient>
      </defs>
      <rect width="300" height="80" rx="12" fill="#1e293b"/>
      <text x="150" y="35" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="url(#gold)" text-anchor="middle" letter-spacing="1">ULTIMATE GAME SHOW</text>
      <text x="150" y="58" font-family="Arial, sans-serif" font-weight="800" font-size="22" fill="#38bdf8" text-anchor="middle" letter-spacing="3">LIVE</text>
    </svg>
    <div id="status-badge" class="status-badge">Disconnected</div>
  </div>

  <!-- Join Screen -->
  <div id="join-card">
    <input type="text" id="player-name" class="input-field" placeholder="Enter Your Name" maxlength="15" autocomplete="off" />
    <button id="join-btn" class="btn-join" onclick="initMobileConnection()">Join Game</button>
  </div>

  <!-- Game Controller Screen (Simplified - No Letter Grid / No Wild Card) -->
  <div id="controller-ui">
    <div class="wheel-container">
      <canvas id="touchWheel" width="280" height="280"></canvas>
    </div>

    <div class="bonus-card">
      <svg viewBox="0 0 100 100" width="60" height="60">
        <circle cx="50" cy="50" r="45" fill="none" stroke="#38bdf8" stroke-width="4"/>
        <text x="50" y="45" font-family="Arial" font-weight="bold" font-size="12" fill="#FFE259" text-anchor="middle">UGS</text>
        <text x="50" y="62" font-family="Arial" font-weight="bold" font-size="14" fill="#38bdf8" text-anchor="middle">LIVE</text>
      </svg>
    </div>
  </div>

  <script src="js/buzzer.js"></script>
</body>
</html>
