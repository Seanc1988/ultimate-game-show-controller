<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battle Royale — Remote Audience</title><style>
:root{--a:#1640a4;--b:#76115e;--cyan:#22d9ff;--gold:#ffd34c;--cover:#087f3f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Segoe UI,sans-serif;background:#020615;color:#fff}body{background:radial-gradient(circle at 15% 5%,var(--a),transparent 35%),radial-gradient(circle at 88% 8%,var(--b),transparent 33%),#020615}.stage{height:100%;padding:2vh 2vw 1.2vh;display:grid;grid-template-rows:minmax(0,1fr) 16%;gap:1vh}.main{min-height:0;display:flex;flex-direction:column;align-items:center}.category{width:89.44%;height:9.5vh;display:grid;place-items:center;border:2px solid #79e8ff;border-radius:1vw;background:linear-gradient(#1b4fad,#081a5b);font-size:clamp(24px,3.2vw,62px);font-weight:1000;color:var(--gold)}.board{width:89.44%;max-height:calc(100% - 11vh);aspect-ratio:14/4.15;flex:1;margin-top:1.2vh;padding:1vh;display:grid;grid-template-rows:repeat(4,1fr);gap:.45vw;border:3px solid #376ca8;border-radius:1.2vw;background:#06102a;box-shadow:inset 0 0 5vw #000,0 1vh 3vh #000}.row{display:grid;grid-template-columns:repeat(14,1fr);gap:.38vw;min-height:0}.tile{display:grid;place-items:center;border:2px solid #8ff3ff;border-radius:.35vw;background:linear-gradient(#fff,#a9edf5);color:#071126;font-size:clamp(25px,5vw,94px);font-weight:1000}.tile.hidden{color:transparent;background:linear-gradient(#40e8f4,#08aabd)}.tile.inactive{color:transparent;border-color:#04331d;background:linear-gradient(145deg,var(--cover),#043d28)}.foot{display:grid;grid-template-columns:minmax(570px,.9fr) 1.1fr;gap:1vw}.metrics{display:grid;grid-template-columns:repeat(3,1fr) minmax(175px,1.25fr);gap:.6vw}.metric,.join{display:grid;place-items:center;text-align:center;border:2px solid #38689e;border-radius:.8vw;background:#0b1c49}.metric strong{font-size:clamp(20px,2.5vw,48px);color:var(--cyan);line-height:1}.metric span,.join span{display:block;font-size:clamp(9px,.9vw,17px);font-weight:1000}.join{grid-template-columns:auto 1fr;gap:.6vw;padding:.35vh .5vw;background:linear-gradient(145deg,#132d69,#071538);color:#fff;border-color:var(--cyan)}.join.hidden{display:none}.qr{height:min(12.5vh,138px);aspect-ratio:1;background:#fff;padding:2px;border-radius:.3vw;box-shadow:0 .25vh .8vh #0008}.qr svg{width:100%;height:100%;display:block}.finishers{display:grid;place-items:center;font-size:clamp(16px,1.5vw,28px);font-weight:900}.round{position:fixed;right:2vw;top:1.5vh;z-index:5;padding:.6vh .8vw;border:2px solid #4279b7;border-radius:.8vw;background:#081638;font-weight:1000}.full{position:fixed;left:1vw;top:1vh;z-index:10;border:2px solid #79e8ff;border-radius:999px;padding:.7vh 1vw;background:#071638;color:#fff;font-weight:1000}.cover{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:4vh;background:radial-gradient(circle,#123b9c,#050a22 70%)}.cover.show{display:grid}.card{text-align:center;width:94vw}.card h1{font-size:clamp(40px,7vw,120px);margin:0;color:var(--gold)}.leader-grid{display:grid;grid-template-columns:1fr 1fr;gap:2vw;margin-top:2vh}.leader{background:#07142f;border:2px solid #38689e;border-radius:1vw;overflow:hidden}.leader h2{margin:0;padding:1vh;background:#152b65}.leader-row{display:grid;grid-template-columns:10% 1fr 25%;padding:.7vh 1vw;border-top:1px solid #234570;font-size:clamp(12px,1.1vw,21px)}.status{position:fixed;left:50%;bottom:1vh;transform:translateX(-50%);z-index:50;padding:.5vh 1vw;border-radius:999px;background:#000b;font-weight:900}.winner{font-size:clamp(55px,9vw,160px);font-weight:1000}.winner small{display:block;font-size:.35em;color:var(--cyan)}
</style></head><body><button class="full" id="full">⛶ FULL SCREEN</button><div class="round" id="round">CONNECTING…</div><div class="stage"><main class="main"><div class="category" id="category">BATTLE ROYALE</div><div class="board" id="board"></div></main><footer class="foot"><div class="metrics"><div class="metric"><div><strong id="active">0</strong><span>ACTIVE</span></div></div><div class="metric"><div><strong id="solved">0</strong><span>SOLVED</span></div></div><div class="metric"><div><strong id="left">0</strong><span>LETTERS LEFT</span></div></div><div class="join" id="join"><div class="qr" id="qr"></div><span>JOIN THE GAME</span></div></div><div class="finishers" id="finishers">Connecting to the host…</div></footer></div><section class="cover" id="results"><div class="card"><h1 id="answer">PUZZLE COMPLETE</h1><div class="leader-grid"><div class="leader"><h2>CURRENT GAME</h2><div id="game"></div></div><div class="leader"><h2>ALL-TIME</h2><div id="alltime"></div></div></div></div></section><section class="cover" id="winner"><div class="card"><h1>BATTLE ROYALE CHAMPION</h1><div class="winner" id="winner-name">WINNER<small id="winner-score"></small></div></div></section><div class="status" id="status">Connecting to the game host…</div><script src="peerjs.min.js"></script><script src="qrcode.min.js"></script><script src="battle-audience-remote.js?v=5210"></script></body></html>
