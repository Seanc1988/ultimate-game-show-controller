n:15px 0}.join button{width:100%;padding:15px;border:0;border-radius:12px;background:var(--c);font-weight:900;font-size:18px}.small{font-size:13px;color:#8fa2ca;margin-top:18px}@media(min-width:520px){.name{font-size:62px}.control{font-size:54px}}
.signup{display:none}.signup.show{display:block}.signup input{width:100%;padding:16px;text-align:center;font-size:22px;border-radius:12px;border:2px solid var(--c);margin:15px 0}.signup button,.reconnect{width:100%;padding:15px;border:0;border-radius:12px;background:var(--c);font-weight:900;font-size:18px}.pool-note{padding:12px;border:1px solid rgba(255,211,77,.5);border-radius:12px;background:rgba(255,211,77,.08);color:#fff3b0;line-height:1.4}.avatar-picker{margin:10px 0;padding:10px;border:1px solid #526ea8;border-radius:12px}.avatar-preview{width:92px;height:92px;margin:0 auto 8px;border:4px solid var(--c);border-radius:50%;display:grid;place-items:center;overflow:hidden;background:#111b38;font-size:48px}.avatar-preview img{width:100%;height:100%;object-fit:cover}.avatar-options{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.avatar-options button{width:46px;padding:7px;font-size:25px;background:#1a2748;color:#fff}.photo-label{display:block;margin:9px auto 0;padding:10px;border-radius:9px;background:#ffd34d;color:#171000;font-weight:900}.photo-label input{display:none}.reconnect{display:none;margin:10px auto;background:#ffd34d;color:#171000}.reconnect.show{display:block}.phone-puzzle{display:none;margin:12px 0;padding:14px;border:2px solid #526ea8;border-radius:14px;background:#050b1d}.phone-puzzle.show{display:block}.phone-puzzle .cat{color:#ffd34d;font-weight:900;font-size:13px;letter-spacing:2px}.phone-puzzle .phrase{margin-top:8px;font:900 24px/1.35 monospace;letter-spacing:3px;overflow-wrap:anywhere}.advantages{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:8px 0}.adv{padding:7px 11px;border:1px solid #ffd34d;border-radius:999px;background:#513807;color:#fff3a4;font-weight:900}.phone-notice,.bonus-wheel,.selection-alert{display:none;position:fixed;inset:0;z-index:10;place-items:center;padding:22px;background:rgba(2,5,16,.96)}.phone-notice.show,.bonus-wheel.show,.selection-alert.show{display:grid}.notice-card,.bonus-card,.selection-card{width:100%;max-width:500px;padding:28px 22px;border:4px solid #ffd34d;border-radius:24px;background:radial-gradient(circle at top,#263f82,#090d28 70%);box-shadow:0 0 45px #ffd34d55}.notice-kicker{color:#ff5ca3;font-weight:900;letter-spacing:3px}.notice-title{margin:15px 0;color:#ffd34d;font-size:42px;font-weight:1000}.notice-copy{font-size:21px;line-height:1.35}.bonus-disc{width:240px;height:240px;margin:15px auto;border:12px solid #ffd34d;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#ff2f7f,#ffd60a,#27d9ff,#39d353,#b07bff,#ff2f7f);font-size:35px;font-weight:1000;text-shadow:0 2px 5px #000}.bonus-disc.spin{animation:phoneSpin 2.5s cubic-bezier(.2,.8,.2,1)}@keyframes phoneSpin{to{transform:rotate(1440deg)}}.bonus-card button{width:100%;padding:16px;border:0;border-radius:12px;background:#ffd34d;font-size:20px;font-weight:1000}.selection-alert.selected{background:#063d1c}.selection-alert.not-selected{background:#500b16}.selection-card{border-color:#fff;text-align:center;animation:selectionPulse .75s ease-in-out infinite alternate}.selection-alert.selected .selection-card{background:radial-gradient(circle at top,#25c766,#063d1c 72%);box-shadow:0 0 80px #4cff88}.selection-alert.not-selected .selection-card{background:radial-gradient(circle at top,#d92e49,#500b16 72%);box-shadow:0 0 80px #ff405e}.selection-icon{font-size:80px}.selection-title{font-size:clamp(38px,11vw,64px);font-weight:1000;line-height:.95;margin:12px 0}.selection-copy{font-size:22px;line-height:1.3;font-weight:800}@keyframes selectionPulse{to{transform:scale(1.025);filter:brightness(1.12)}}
.session-actions{display:grid;gap:8px;margin-top:12px}.session-actions button{width:100%;padding:14px;border:1px solid #ffffff55;border-radius:12px;background:#1a2748;color:#fff;font-weight:900;font-size:17px}.wild-use{display:none!important;background:linear-gradient(135deg,#ffd60a,#ff8c00)!important;color:#1a1000!important;border:3px solid #fff!important}.wild-use.show{display:block!important}.bonus-choices{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 0}.bonus-choice{min-height:72px!important;padding:8px!important;font-size:26px!important;background:linear-gradient(145deg,#6f1d9b,#e12b87)!important;color:#fff!important;border:3px solid #ffd34d!important}.bonus-choice.logo{font-size:13px!important;line-height:1.05}
.phone-puzzle .phrase.board-grid{display:grid;grid-template-rows:repeat(4,auto);gap:3px;letter-spacing:0}.phone-board-row{display:grid;grid-template-columns:repeat(14,1fr);gap:2px}.phone-board-cell{aspect-ratio:1;display:grid;place-items:center;border:1px solid #29476f;border-radius:2px;background:#061226;color:#fff;font:900 clamp(10px,3.6vw,18px)/1 Arial}.phone-board-cell.active{background:#087b4e;border-color:#44e0a4}.phone-board-cell.revealed{background:#fff;color:#071126}.phone-board-cell.punct{background:#fff;color:#071126}.bonus-choice.chosen{transform:scale(1.12);box-shadow:0 0 35px #ffd34d}.bonus-choice.faded{opacity:.16;transform:scale(.86)}
.emoji-entry{width:100%;margin:9px 0 0!important;padding:9px!important;font-size:18px!important;text-align:center}
.profile-editor{display:none;position:fixed;inset:0;z-index:30;place-items:center;padding:18px;background:rgba(2,5,16,.97)}.profile-editor.show{display:grid}.profile-card{width:100%;max-width:500px;max-height:94vh;overflow:auto;padding:24px;border:4px solid var(--c);border-radius:22px;background:#09132d}.profile-card h2{margin:0 0 10px;color:#ffd34d}.profile-card>input{width:100%;padding:14px;border:2px solid var(--c);border-radius:10px;font-size:21px;text-align:center}.profile-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.profile-actions button{padding:14px;border:0;border-radius:10px;font-weight:900}.profile-save{background:var(--c)}.profile-cancel{background:#28395f;color:#fff}
</style>

<body><main class="app"><section class="card">
<div class="eyebrow">LIVE WHEEL CONTROLLER</div><div class="name" id="name">PLAYER</div><div class="status" id="status">Connecting…</div>
<div class="join" id="join"><p>Enter the room code shown by the host.</p><input id="room" maxlength="4" autocomplete="off"><button id="joinBtn">JOIN GAME</button></div>
<div class="signup" id="signup"><div class="pool-note">Enter your name for a chance to become a contestant.<br><strong>After signing up, please do not close this window.</strong></div><input id="signupName" maxlength="30" autocomplete="name" placeholder="YOUR NAME"><div class="avatar-picker"><div class="avatar-preview" id="avatarPreview">⭐</div><div class="avatar-options"><button type="button" data-avatar="⭐">⭐</button><button type="button" data-avatar="🦊">🦊</button><button type="button" data-avatar="🦁">🦁</button><button type="button" data-avatar="🐼">🐼</button><button type="button" data-avatar="🎤">🎤</button></div><input class="emoji-entry" id="avatarEmoji" maxlength="8" inputmode="text" placeholder="OR TYPE/PICK ANY EMOJI"><label class="photo-label">📷 TAKE OR UPLOAD PHOTO<input id="avatarPhoto" type="file" accept="image/*" capture="user"></label></div><button id="signupBtn">JOIN CONTESTANT POOL</button></div>
<div class="phone-puzzle" id="phonePuzzle"><div class="cat" id="phoneCategory"></div><div class="phrase" id="phonePhrase"></div></div><div class="advantages" id="advantages"></div>
<button class="control" id="control" disabled>WAIT</button>
<button class="reconnect wild-use" id="wildUse" type="button">🃏 USE WILD CARD</button>
<div class="answer" id="answer"><input id="answerText" placeholder="TYPE YOUR ANSWER"><button id="sendAnswer">SEND</button></div>
<div class="session-actions"><button class="reconnect" id="reconnectBtn" type="button">↻ RECONNECT</button><button id="editProfileBtn" type="button">✎ EDIT NAME / PHOTO</button><button id="newGameBtn" type="button">DISCONNECT / JOIN NEW GAME</button></div>
<div class="small">Keep this page open throughout the game.</div>
</section></main><div class="phone-notice" id="phoneNotice"><div class="notice-card"><div class="notice-kicker" id="noticeKicker"></div><div class="notice-title" id="noticeTitle"></div><div class="notice-copy" id="noticeCopy"></div></div></div><div class="bonus-wheel" id="bonusWheel"><div class="bonus-card"><div class="notice-kicker">PICK A MYSTERY BONUS CARD</div><div class="bonus-choices" id="bonusChoices"></div><div class="bonus-disc" id="bonusDisc">SEALED</div></div></div><div class="selection-alert" id="selectionAlert"><div class="selection-card"><div class="selection-icon" id="selectionIcon"></div><div class="selection-title" id="selectionTitle"></div><div class="selection-copy" id="selectionCopy"></div></div></div><div class="profile-editor" id="profileEditor"><div class="profile-card"><h2>EDIT YOUR DISPLAY</h2><input id="profileName" maxlength="30" autocomplete="name" placeholder="DISPLAY NAME"><div class="avatar-picker"><div class="avatar-preview" id="profilePreview">⭐</div><div class="avatar-options"><button type="button" data-profile-avatar="⭐">⭐</button><button type="button" data-profile-avatar="🦊">🦊</button><button type="button" data-profile-avatar="🦁">🦁</button><button type="button" data-profile-avatar="🐼">🐼</button><button type="button" data-profile-avatar="🎤">🎤</button></div><input class="emoji-entry" id="profileEmoji" maxlength="8" placeholder="OR TYPE/PICK ANY EMOJI"><label class="photo-label">📷 TAKE OR UPLOAD PHOTO<input id="profilePhoto" type="file" accept="image/*" capture="user"></label></div><div class="profile-actions"><button class="profile-cancel" id="profileCancel" type="button">CANCEL</button><button class="profile-save" id="profileSave" type="button">SAVE CHANGES</button></div></div></div>
<script>window.onerror=function(){var s=document.getElementById('status');if(s){s.textContent='This phone could not start. Refresh once or try Safari without Private Browsing.';s.style.color='#ff9a9a';}};</script>
<script src="peerjs.min.js?v=44" onerror="document.getElementById('status').textContent='The connection library did not load. Check your internet and use Reconnect.'"></script>
<script>
const q=new URLSearchParams(location.search);let room=(q.get('room')||'').toUpperCase();let poolMode=q.get('mode')==='pool';let player=q.has('p')?Number(q.get('p')):(poolMode?-1:0);let playerName=q.get('name')||(player>=0?`Player ${player+1}`:'Contestant');let color=q.get('color')||'#27d9ff';let bindToken=q.get('bind')||'';let signupName='',avatarValue='⭐',selectedLocked=false;try{signupName=localStorage.getItem('wheelPoolName')||'';avatarValue=localStorage.getItem('wheelPoolAvatar')||'⭐'}catch(_){}
try{const saved=JSON.parse(localStorage.getItem('wheelPlayerBinding')||'null');if(saved&&saved.room===room&&Number.isInteger(saved.player)){player=saved.player;playerName=saved.playerName||playerName;color=saved.color||color;bindToken=saved.bindToken||bindToken;poolMode=false;selectedLocked=!!saved.selectedLocked}}catch(_){}
document.documentElement.style.setProperty('--c',color);document.getElementById('name').textContent=playerName;
const control=document.getElementById('control'),statusEl=document.getElementById('status'),join=document.getElementById('join'),signup=document.getElementById('signup'),answer=document.getElementById('answer'),reconnectBtn=document.getElementById('reconnectBtn');let conn=null,peer=null,lastState={},retryTimer=null,retryCount=0,manualClose=false;
const rtc={iceServers:[{urls:'stun:stun.relay.metered.ca:80'},{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'turn:global.relay.metered.ca:80',username:'ba88079176616565ef57f408',credential:'2sorAbF4hI8eMjGO'},{urls:'turn:global.relay.metered.ca:80?transport=tcp',username:'ba88079176616565ef57f408',credential:'2sorAbF4hI8eMjGO'},{urls:'turn:global.relay.metered.ca:443',username:'ba88079176616565ef57f408',credential:'2sorAbF4hI8eMjGO'},{urls:'turns:global.relay.metered.ca:443?transport=tcp',username:'ba88079176616565ef57f408',credential:'2sorAbF4hI8eMjGO'}]};
function setStatus(t){statusEl.textContent=t}function send(d){if(conn&&conn.open)conn.send(Object.assign({player,bindToken},d))}
function saveBinding(){try{localStorage.setItem('wheelPlayerBinding',JSON.stringify({room,player,playerName,color,bindToken,selectedLocked}))}catch(_){}}
function renderBoard(rows,el){el.innerHTML='';el.classList.add('board-grid');for(const row of rows){const r=document.createElement('div');r.className='phone-board-row';for(const cell of row){const c=document.createElement('div');c.className='phone-board-cell'+(cell.active?' active':'')+(cell.revealed?' revealed':'');c.textContent=cell.char||'';r.appendChild(c)}el.appendChild(r)}}
function render(s){lastState=s||lastState;if(lastState.gameStarted&&selectedLocked){selectedLocked=false;saveBinding();document.getElementById('selectionAlert').classList.remove('show')}if(selectedLocked)return;answer.classList.remove('show');const pp=document.getElementById('phonePuzzle'),phrase=document.getElementById('phonePhrase'),cat=document.getElementById('phoneCategory'),adv=document.getElementById('advantages'),wild=document.getElementById('wildUse');if(lastState.puzzle){pp.classList.add('show');if(Array.isArray(lastState.boardRows)&&lastState.boardRows.length)renderBoard(lastState.boardRows,phrase);else{phrase.classList.remove('board-grid');phrase.textContent=lastState.puzzle}cat.textContent=lastState.category||'PUZZLE'}else pp.classList.remove('show');const held=(lastState.advantages&&lastState.advantages[player])||[];adv.innerHTML=held.map(x=>`<span class="adv">${String(x).replace(/[<>&]/g,'')}</span>`).join('');wild.classList.toggle('show',player===lastState.activePlayer&&held.some(x=>String(x).startsWith('Wild Card'))&&!lastState.armed);if(lastState.armed){control.disabled=false;control.textContent='BUZZ IN';setStatus('Toss-up is live — buzz when you know it!');control.dataset.action='buzz'}else if(lastState.spinEnabled&&lastState.activePlayer===player){control.disabled=false;control.textContent='SPIN THE WHEEL';setStatus('It is your turn!');control.dataset.action='spin'}else{control.disabled=true;control.textContent=lastState.activePlayer===player?'WAIT':'NOT YOUR TURN';setStatus(lastState.status||'Wait for the host');control.dataset.action=''}}
function selectedAlert(){if(navigator.vibrate)navigator.vibrate([500,180,500,180,500,180,500,180,500,180,500,180,500]);try{const C=window.AudioContext||window.webkitAudioContext,c=new C();for(let i=0;i<8;i++){const o=c.createOscillator(),g=c.createGain();o.frequency.value=660+(i%3)*150;g.gain.setValueAtTime(.0001,c.currentTime+i*.55);g.gain.exponentialRampToValueAtTime(.16,c.currentTime+i*.55+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+i*.55+.28);o.connect(g).connect(c.destination);o.start(c.currentTime+i*.55);o.stop(c.currentTime+i*.55+.3)}}catch(_){}}
function showSelection(kind,title,copy,persistent){const box=document.getElementById('selectionAlert');box.className='selection-alert show '+kind;document.getElementById('selectionIcon').textContent=kind==='selected'?'★':'✕';document.getElementById('selectionTitle').textContent=title;document.getElementById('selectionCopy').textContent=copy;if(!persistent)setTimeout(()=>box.classList.remove('show'),3800)}
function handleMessage(d){
 if(!d||typeof d!=='object')return;
 if(d.type==='state'&&player>=0)render(d);
 if(d.type==='ack'){retryCount=0;reconnectBtn.classList.remove('show');if(d.bindToken)bindToken=d.bindToken;saveBinding();setStatus(selectedLocked?'You are selected. Please go to the host.':'Connected — waiting for the host')}
 if(d.type==='pool-confirmed'){setStatus('You are in the contestant pool! Please do not close this window.');document.getElementById('signupBtn').disabled=true;document.getElementById('signupName').disabled=true}
 if(d.type==='selected'){player=Number(d.player);playerName=d.playerName||`Player ${player+1}`;color=d.color||color;bindToken=d.bindToken||bindToken;avatarValue=d.avatar||avatarValue;poolMode=false;selectedLocked=true;saveBinding();document.documentElement.style.setProperty('--c',color);document.getElementById('name').textContent=playerName;signup.classList.remove('show');control.style.display='none';send({type:'hello'});setStatus(`Selected as Player ${player+1}`);showSelection('selected',`YOU ARE PLAYER ${player+1}`,`Please make your way to our host to take your spot.`,true);selectedAlert()}
 if(d.type==='not-selected'){signup.classList.remove('show');control.style.display='none';document.getElementById('name').textContent='THANK YOU';setStatus('Unfortunately, you were not chosen this round. Please try again next round. Keep this window open.');showSelection('not-selected','NOT SELECTED THIS ROUND','Unfortunately, you were not chosen this round. Please try again next round and keep this window open.',true)}
 if(d.type==='pool-reopened'){document.getElementById('selectionAlert').classList.remove('show');poolMode=true;player=-1;signup.classList.remove('show');control.style.display='none';document.getElementById('name').textContent='NEXT ROUND';setStatus('You are eligible for the next draw. Please keep this window open.')}
 if(d.type==='game-intro'){selectedLocked=false;saveBinding();document.getElementById('selectionAlert').classList.remove('show');control.style.display='flex';setStatus('The show is starting!')}
 if(d.type==='profile-sync'&&d.player===player){playerName=d.name||playerName;avatarValue=d.avatar||'⭐';document.getElementById('name').textContent=playerName;saveBinding();setStatus('The host updated your display profile.')}
 if(d.type==='kicked'){try{localStorage.removeItem('wheelPlayerBinding')}catch(_){}bindToken='';control.disabled=true;setStatus('This slot was reset by the host. Scan the new QR code.');reconnectBtn.classList.add('show')}
 if(d.type==='answer-prompt'&&d.player===player){control.disabled=true;answer.classList.add('show');document.getElementById('answerText').focus();setStatus('Type your answer, then send it.')}
 if(d.type==='answer-clear'){answer.classList.remove('show');render(lastState)}
 if(d.type==='special-notice'){document.getElementById('noticeKicker').textContent=d.kicker||'SPECIAL WEDGE';document.getElementById('noticeTitle').textContent=d.title||'';document.getElementById('noticeCopy').textContent=d.copy||'';document.getElementById('phoneNotice').classList.add('show')}
 if(d.type==='special-clear')document.getElementById('phoneNotice').classList.remove('show');
 if(d.type==='bonus-card-prompt'&&d.player===player){const choices=document.getElementById('bonusChoices');choices.innerHTML=(d.labels||[]).map((label,i)=>`<button class="bonus-choice ${label==='LOGO'?'logo':''}" data-card="${i}">${label==='LOGO'?'ULTIMATE<br>GAME SHOW<br>LIVE':label}</button>`).join('');choices.querySelectorAll('button').forEach(b=>b.onclick=()=>{choices.querySelectorAll('button').forEach(x=>{x.disabled=true;x.classList.add(x===b?'chosen':'faded')});send({type:'bonus-card-pick',card:Number(b.dataset.card)});document.getElementById('bonusDisc').textContent='MYSTERY ENVELOPE SEALED'});document.getElementById('bonusDisc').textContent='CHOOSE ONE';document.getElementById('bonusWheel').classList.add('show')}
 if(d.type==='bonus-prize-sealed'){const disc=document.getElementById('bonusDisc');disc.textContent='SEALED';setTimeout(()=>document.getElementById('bonusWheel').classList.remove('show'),1800)}
 if(d.type==='bonus-letter-prompt'){document.getElementById('noticeKicker').textContent='BONUS PUZZLE';document.getElementById('noticeTitle').textContent='PICK YOUR LETTERS';document.getElementById('noticeCopy').textContent='Choose three consonants and one vowel. Tell your selections to the host.';document.getElementById('phoneNotice').classList.add('show')}
 if(d.type==='bonus-prize-result'){const disc=document.getElementById('bonusDisc');disc.classList.remove('spin');disc.textContent='$'+Number(d.prize||0).toLocaleString();document.getElementById('bonusWheel').classList.add('show');setTimeout(()=>document.getElementById('bonusWheel').classList.remove('show'),3500)}
}
function scheduleReconnect(){clearTimeout(retryTimer);reconnectBtn.classList.add('show');const delay=Math.min(12000,1000*Math.pow(1.7,retryCount++));retryTimer=setTimeout(()=>connect(true),delay)}
function connect(force){if(!room){join.classList.add('show');control.style.display='none';setStatus('Room code needed');return}join.classList.remove('show');if(poolMode&&player<0){signup.classList.add('show');control.style.display='none';document.getElementById('name').textContent='SIGN UP'}else if(!selectedLocked)control.style.display='flex';setStatus(force?'Reconnecting…':'Connecting…');if(typeof Peer==='undefined'){setStatus('Controller could not load. Check your internet and use Reconnect.');reconnectBtn.classList.add('show');return}manualClose=true;try{if(conn)conn.close();if(peer)peer.destroy()}catch(_){}manualClose=false;peer=new Peer(undefined,{debug:0,config:rtc});let opened=false;const timeout=setTimeout(()=>{if(!opened){setStatus('Connection is taking longer than expected.');scheduleReconnect()}},12000);peer.on('open',()=>{conn=peer.connect('wheel-'+room,{reliable:true,serialization:'json'});conn.on('open',()=>{opened=true;clearTimeout(timeout);retryCount=0;reconnectBtn.classList.remove('show');if(player>=0)send({type:'hello'});else if(signupName)sendPoolSignup();setStatus(poolMode&&player<0?'Connected — enter your name below.':selectedLocked?'You are selected. Please go to the host.':'Connected — waiting for the host')});conn.on('data',handleMessage);conn.on('close',()=>{if(!manualClose){setStatus('Disconnected — reconnecting automatically…');scheduleReconnect()}});conn.on('error',()=>{setStatus('Connection interrupted — reconnecting…');scheduleReconnect()})});peer.on('disconnected',()=>{if(!manualClose){try{peer.reconnect()}catch(_){scheduleReconnect()}}});peer.on('error',err=>{clearTimeout(timeout);setStatus(err&&err.type==='peer-unavailable'?'The host room is not ready yet. Reconnecting…':'Could not connect. Check internet, then tap Reconnect.');scheduleReconnect()})}
control.onclick=()=>{const a=control.dataset.action;if(!a)return;control.disabled=true;send({type:a});if(navigator.vibrate)navigator.vibrate(80)};
document.getElementById('sendAnswer').onclick=()=>{const input=document.getElementById('answerText');send({type:'game-answer',answer:input.value});input.value='';answer.classList.remove('show');setStatus('Answer sent — waiting for host')};
document.getElementById('joinBtn').onclick=()=>{room=document.getElementById('room').value.trim().toUpperCase();if(room.length===4)connect(true)};
function poolToken(){let token='';try{token=localStorage.getItem('wheelPoolToken')||'';if(!token){token='guest-'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('wheelPoolToken',token)}}catch(_){token='guest-'+Math.random().toString(36).slice(2)}return token}
function sendPoolSignup(){send({type:'pool-signup',name:signupName,token:poolToken(),avatar:avatarValue})}
document.getElementById('signupBtn').onclick=()=>{signupName=document.getElementById('signupName').value.trim();if(!signupName){setStatus('Please enter your name.');return}try{localStorage.setItem('wheelPoolName',signupName);localStorage.setItem('wheelPoolAvatar',avatarValue)}catch(_){}sendPoolSignup();setStatus('Adding your name…')};
document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{avatarValue=b.dataset.avatar;try{localStorage.setItem('wheelPoolAvatar',avatarValue)}catch(_){}document.getElementById('avatarPreview').textContent=avatarValue});
document.getElementById('avatarEmoji').oninput=e=>{const value=e.target.value.trim();if(!value)return;avatarValue=value;try{localStorage.setItem('wheelPoolAvatar',avatarValue)}catch(_){}document.getElementById('avatarPreview').textContent=avatarValue};
document.getElementById('avatarPhoto').onchange=e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const size=256,c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d'),scale=Math.max(size/img.width,size/img.height),w=img.width*scale,h=img.height*scale;x.drawImage(img,(size-w)/2,(size-h)/2,w,h);avatarValue=c.toDataURL('image/jpeg',.72);document.getElementById('avatarPreview').innerHTML=`<img alt="Your photo" src="${avatarValue}">`};img.src=reader.result};reader.readAsDataURL(file)};
function paintProfilePreview(){const p=document.getElementById('profilePreview');if(avatarValue.startsWith('data:image/'))p.innerHTML=`<img alt="Your photo" src="${avatarValue}">`;else p.textContent=avatarValue||'⭐'}
function cropProfilePhoto(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const size=256,c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d'),scale=Math.max(size/img.width,size/img.height),w=img.width*scale,h=img.height*scale;x.drawImage(img,(size-w)/2,(size-h)/2,w,h);avatarValue=c.toDataURL('image/jpeg',.72);paintProfilePreview()};img.src=reader.result};reader.readAsDataURL(file)}
document.getElementById('editProfileBtn').onclick=()=>{if(player<0){setStatus('Join the contestant pool before editing your profile.');return}document.getElementById('profileName').value=playerName;paintProfilePreview();document.getElementById('profileEditor').classList.add('show')};
document.querySelectorAll('[data-profile-avatar]').forEach(b=>b.onclick=()=>{avatarValue=b.dataset.profileAvatar;paintProfilePreview()});
document.getElementById('profileEmoji').oninput=e=>{const value=e.target.value.trim();if(value){avatarValue=value;paintProfilePreview()}};
document.getElementById('profilePhoto').onchange=e=>cropProfilePhoto(e.target.files&&e.target.files[0]);
document.getElementById('profileCancel').onclick=()=>document.getElementById('profileEditor').classList.remove('show');
document.getElementById('profileSave').onclick=()=>{const next=document.getElementById('profileName').value.trim();if(!next)return;playerName=next;signupName=next;document.getElementById('name').textContent=playerName;try{localStorage.setItem('wheelPoolName',playerName);localStorage.setItem('wheelPoolAvatar',avatarValue)}catch(_){}saveBinding();send({type:'profile-update',name:playerName,avatar:avatarValue});document.getElementById('profileEditor').classList.remove('show');setStatus('Profile update sent to the host.')};
reconnectBtn.onclick=()=>{retryCount=0;connect(true)};document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(!conn||!conn.open))connect(true)});window.addEventListener('online',()=>connect(true));
document.getElementById('wildUse').onclick=()=>{send({type:'use-wild'});document.getElementById('wildUse').classList.remove('show');setStatus('Wild Card armed — call a consonant to the host.')};
document.getElementById('newGameBtn').onclick=()=>{if(!confirm('Disconnect and clear this phone\'s saved contestant session?'))return;manualClose=true;try{conn&&conn.close();peer&&peer.destroy()}catch(_){}try{['wheelPlayerBinding','wheelPoolToken','wheelPoolName','wheelPoolAvatar'].forEach(k=>localStorage.removeItem(k))}catch(_){}const u=new URL(location.href);u.search='';location.href=u.toString()};
if(signupName)document.getElementById('signupName').value=signupName;if(avatarValue.startsWith('data:image/'))document.getElementById('avatarPreview').innerHTML=`<img alt="Your photo" src="${avatarValue}">`;else document.getElementById('avatarPreview').textContent=avatarValue;if(selectedLocked)showSelection('selected',`YOU ARE PLAYER ${player+1}`,`Please make your way to our host to take your spot.`,true);connect(false);
</script></body></html>
