<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wheel Game Controller</title>
<style>
:root{--c:#27d9ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#183767,#071126 65%,#02050d);color:#fff;font-family:Arial,sans-serif}.app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(520px,100%);text-align:center}.eyebrow{font-weight:900;letter-spacing:.18em;color:#ffd34d}.name{font-size:clamp(34px,11vw,62px);font-weight:1000;color:var(--c);text-transform:uppercase;margin:8px 0}.status{min-height:3em;color:#c9d6f4;font-size:18px}.control{width:min(78vw,330px);aspect-ratio:1;border:8px solid #fff5;border-radius:50%;margin:24px auto;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:clamp(30px,10vw,54px);line-height:.95;font-weight:1000;text-transform:uppercase;color:#061126;background:linear-gradient(145deg,#fff,var(--c) 60%,#557);box-shadow:0 16px 0 #0008,0 0 45px color-mix(in srgb,var(--c) 55%,transparent);touch-action:manipulation}.control:active:not(:disabled){transform:translateY(8px);box-shadow:0 8px 0 #0008}.control:disabled{filter:grayscale(.7);opacity:.38;box-shadow:none}.answer{display:none;gap:10px;margin-top:18px}.answer.show{display:flex}.answer input{min-width:0;flex:1;border:2px solid var(--c);border-radius:12px;padding:14px;font-size:18px;text-transform:uppercase}.answer button{border:0;border-radius:12px;padding:12px 18px;font-weight:900;background:var(--c);color:#041020}.join{display:none}.join.show{display:block}.join input{width:100%;padding:16px;text-align:center;text-transform:uppercase;font-size:25px;letter-spacing:.2em;border-radius:12px;border:2px solid var(--c);margin:15px 0}.join button{width:100%;padding:15px;border:0;border-radius:12px;background:var(--c);font-weight:900;font-size:18px}.small{font-size:13px;color:#8fa2ca;margin-top:18px}
</style>
</head>
<body><main class="app"><section class="card">
<div class="eyebrow">LIVE WHEEL CONTROLLER</div><div class="name" id="name">PLAYER</div><div class="status" id="status">Connecting…</div>
<div class="join" id="join"><p>Enter the room code shown by the host.</p><input id="room" maxlength="4" autocomplete="off"><button id="joinBtn">JOIN GAME</button></div>
<button class="control" id="control" disabled>WAIT</button>
<div class="answer" id="answer"><input id="answerText" placeholder="TYPE YOUR ANSWER"><button id="sendAnswer">SEND</button></div>
<div class="small">Keep this page open throughout the game.</div>
</section></main>
<script src="peerjs.min.js"></script>
<script>
const q=new URLSearchParams(location.search);let room=(q.get('room')||'').toUpperCase();const player=Number(q.get('p')||0);const playerName=q.get('name')||`Player ${player+1}`;const color=q.get('color')||'#27d9ff';
document.documentElement.style.setProperty('--c',color);document.getElementById('name').textContent=playerName;
const control=document.getElementById('control'),statusEl=document.getElementById('status'),join=document.getElementById('join'),answer=document.getElementById('answer');let conn=null,lastState={};
const rtc={iceServers:[{urls:'stun:stun.relay.metered.ca:80'},{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'turn:global.relay.metered.ca:80',username:'ba88079176616565ef57f408',credential:'2sorAbF4hI8eMjGO'},{urls:'turn:global.relay.metered.ca:80?transport=tcp',username:'ba88079176616565ef57f408',credential:'2sorAbF4hI8eMjGO'},{urls:'turn:global.relay.metered.ca:443',username:'ba88079176616565ef57f408',credential:'2sorAbF4hI8eMjGO'},{urls:'turns:global.relay.metered.ca:443?transport=tcp',username:'ba88079176616565ef57f408',credential:'2sorAbF4hI8eMjGO'}]};
function setStatus(t){statusEl.textContent=t}function send(d){if(conn&&conn.open)conn.send(Object.assign({player},d))}
function render(s){lastState=s||lastState;answer.classList.remove('show');if(lastState.armed){control.disabled=false;control.textContent='BUZZ IN';setStatus('Toss-up is live — buzz when you know it!');control.dataset.action='buzz'}else if(lastState.spinEnabled&&lastState.activePlayer===player){control.disabled=false;control.textContent='SPIN THE WHEEL';setStatus('It is your turn!');control.dataset.action='spin'}else{control.disabled=true;control.textContent=lastState.activePlayer===player?'WAIT':'NOT YOUR TURN';setStatus(lastState.status||'Wait for the host');control.dataset.action=''}}
function connect(){if(!room){join.classList.add('show');control.style.display='none';setStatus('Room code needed');return}join.classList.remove('show');control.style.display='flex';setStatus('Connecting…');if(typeof Peer==='undefined'){setStatus('Controller could not load. Check your internet and refresh.');return}let ready=false;const timer=setTimeout(()=>{if(!ready)setStatus('Still connecting. Check the room code/network, then refresh or ask the host for a new QR code.')},12000);const peer=new Peer(undefined,{debug:0,config:rtc});peer.on('open',()=>{conn=peer.connect('wheel-'+room,{reliable:true});conn.on('open',()=>{ready=true;clearTimeout(timer);send({type:'hello'});setStatus('Connected — waiting for the host')});conn.on('data',d=>{if(!d||typeof d!=='object')return;if(d.type==='state')render(d);if(d.type==='answer-prompt'&&d.player===player){control.disabled=true;answer.classList.add('show');document.getElementById('answerText').focus();setStatus('Type your answer, then send it.')}if(d.type==='answer-clear'){answer.classList.remove('show');render(lastState)}});conn.on('close',()=>setStatus('Disconnected — refresh to reconnect'))});peer.on('error',()=>{clearTimeout(timer);setStatus('Could not connect. Check the room code and internet, then refresh.')})}
control.onclick=()=>{const a=control.dataset.action;if(!a)return;control.disabled=true;send({type:a});if(navigator.vibrate)navigator.vibrate(80)};
document.getElementById('sendAnswer').onclick=()=>{const input=document.getElementById('answerText');send({type:'game-answer',answer:input.value});input.value='';answer.classList.remove('show');setStatus('Answer sent — waiting for host')};
document.getElementById('joinBtn').onclick=()=>{room=document.getElementById('room').value.trim().toUpperCase();if(room.length===4)connect()};connect();
</script></body></html>
