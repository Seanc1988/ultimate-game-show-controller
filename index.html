<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wheel Game Controller</title>
<style>
:root{--c:#27d9ff}*{box-sizing:border-box}html{min-height:100%;background:#071126}body{margin:0;min-height:100vh;min-height:-webkit-fill-available;background:#071126;color:#fff;font-family:Arial,sans-serif}.app{min-height:100vh;min-height:-webkit-fill-available;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:20px;background:radial-gradient(circle at top,#183767,#071126 65%,#02050d)}.card{width:100%;max-width:520px;text-align:center}.eyebrow{font-weight:900;letter-spacing:3px;color:#ffd34d}.name{font-size:48px;font-size:11vw;font-weight:900;color:var(--c);text-transform:uppercase;margin:8px 0}.status{min-height:3em;color:#c9d6f4;font-size:18px}.control{width:78vw;height:78vw;max-width:330px;max-height:330px;border:8px solid rgba(255,255,255,.35);border-radius:50%;margin:24px auto;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;text-align:center;padding:30px;font-size:42px;line-height:.95;font-weight:900;text-transform:uppercase;color:#061126;background:linear-gradient(145deg,#fff,var(--c) 60%,#557);box-shadow:0 16px 0 rgba(0,0,0,.55),0 0 45px rgba(39,217,255,.55);-webkit-appearance:none;appearance:none}.control:active:not(:disabled){transform:translateY(8px);box-shadow:0 8px 0 rgba(0,0,0,.55)}.control:disabled{filter:grayscale(.7);opacity:.38;box-shadow:none}.answer{display:none;gap:10px;margin-top:18px}.answer.show{display:-webkit-flex;display:flex}.answer input{min-width:0;flex:1;border:2px solid var(--c);border-radius:12px;padding:14px;font-size:18px;text-transform:uppercase}.answer button{border:0;border-radius:12px;padding:12px 18px;font-weight:900;background:var(--c);color:#041020}.join{display:none}.join.show{display:block}.join input{width:100%;padding:16px;text-align:center;text-transform:uppercase;font-size:25px;letter-spacing:3px;border-radius:12px;border:2px solid var(--c);margin:15px 0}.join button{width:100%;padding:15px;border:0;border-radius:12px;background:var(--c);font-weight:900;font-size:18px}.small{font-size:13px;color:#8fa2ca;margin-top:18px}@media(min-width:520px){.name{font-size:62px}.control{font-size:54px}}
.signup{display:none}.signup.show{display:block}.signup input{width:100%;padding:16px;text-align:center;font-size:22px;border-radius:12px;border:2px solid var(--c);margin:15px 0}.signup button{width:100%;padding:15px;border:0;border-radius:12px;background:var(--c);font-weight:900;font-size:18px}.pool-note{padding:12px;border:1px solid rgba(255,211,77,.5);border-radius:12px;background:rgba(255,211,77,.08);color:#fff3b0;line-height:1.4}.phone-puzzle{display:none;margin:12px 0;padding:14px;border:2px solid #526ea8;border-radius:14px;background:#050b1d}.phone-puzzle.show{display:block}.phone-puzzle .cat{color:#ffd34d;font-weight:900;font-size:13px;letter-spacing:2px}.phone-puzzle .phrase{margin-top:8px;font:900 24px/1.35 monospace;letter-spacing:3px;overflow-wrap:anywhere}.advantages{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:8px 0}.adv{padding:7px 11px;border:1px solid #ffd34d;border-radius:999px;background:#513807;color:#fff3a4;font-weight:900}.phone-notice,.bonus-wheel{display:none;position:fixed;inset:0;z-index:10;place-items:center;padding:22px;background:rgba(2,5,16,.95)}.phone-notice.show,.bonus-wheel.show{display:grid}.notice-card,.bonus-card{width:100%;max-width:500px;padding:28px 22px;border:4px solid #ffd34d;border-radius:24px;background:radial-gradient(circle at top,#263f82,#090d28 70%);box-shadow:0 0 45px #ffd34d55}.notice-kicker{color:#ff5ca3;font-weight:900;letter-spacing:3px}.notice-title{margin:15px 0;color:#ffd34d;font-size:42px;font-weight:1000}.notice-copy{font-size:21px;line-height:1.35}.bonus-disc{width:240px;height:240px;margin:15px auto;border:12px solid #ffd34d;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#ff2f7f,#ffd60a,#27d9ff,#39d353,#b07bff,#ff2f7f);font-size:35px;font-weight:1000;text-shadow:0 2px 5px #000}.bonus-disc.spin{animation:phoneSpin 2.5s cubic-bezier(.2,.8,.2,1)}@keyframes phoneSpin{to{transform:rotate(1440deg)}}.bonus-card button{width:100%;padding:16px;border:0;border-radius:12px;background:#ffd34d;font-size:20px;font-weight:1000}
</style>
</head>
<body><main class="app"><section class="card">
<div class="eyebrow">LIVE WHEEL CONTROLLER</div><div class="name" id="name">PLAYER</div><div class="status" id="status">Connecting…</div>
<div class="join" id="join"><p>Enter the room code shown by the host.</p><input id="room" maxlength="4" autocomplete="off"><button id="joinBtn">JOIN GAME</button></div>
<div class="signup" id="signup"><div class="pool-note">Enter your name for a chance to become a contestant.<br><strong>After signing up, please do not close this window.</strong></div><input id="signupName" maxlength="30" autocomplete="name" placeholder="YOUR NAME"><button id="signupBtn">JOIN CONTESTANT POOL</button></div>
<div class="phone-puzzle" id="phonePuzzle"><div class="cat" id="phoneCategory"></div><div class="phrase" id="phonePhrase"></div></div><div class="advantages" id="advantages"></div>
<button class="control" id="control" disabled>WAIT</button>
<div class="answer" id="answer"><input id="answerText" placeholder="TYPE YOUR ANSWER"><button id="sendAnswer">SEND</button></div>
<div class="small">Keep this page open throughout the game.</div>
</section></main><div class="phone-notice" id="phoneNotice"><div class="notice-card"><div class="notice-kicker" id="noticeKicker"></div><div class="notice-title" id="noticeTitle"></div><div class="notice-copy" id="noticeCopy"></div></div></div><div class="bonus-wheel" id="bonusWheel"><div class="bonus-card"><div class="notice-kicker">BONUS PRIZE WHEEL</div><div class="bonus-disc" id="bonusDisc">$10K–$50K</div><button id="bonusSpin">SPIN FOR MY BONUS PRIZE</button></div></div>
<script>window.onerror=function(){var s=document.getElementById('status');if(s){s.textContent='This phone could not start. Refresh once or try Safari without Private Browsing.';s.style.color='#ff9a9a';}};</script>
<script src="peerjs.min.js?v=32" onerror="document.getElementById('status').textContent='The connection library did not load. Check your internet and refresh.'"></script>
<script>
const q=new URLSearchParams(location.search);let room=(q.get('room')||'').toUpperCase();let poolMode=q.get('mode')==='pool';let player=q.has('p')?Number(q.get('p')):(poolMode?-1:0);let playerName=q.get('name')||(player>=0?`Player ${player+1}`:'Contestant');let color=q.get('color')||'#27d9ff';let signupName='';
document.documentElement.style.setProperty('--c',color);document.getElementById('name').textContent=playerName;
const control=document.getElementById('control'),statusEl=document.getElementById('status'),join=document.getElementById('join'),signup=document.getElementById('signup'),answer=document.getElementById('answer');let conn=null,lastState={};
const rtc={iceServers:[{urls:'stun:stun.relay.metered.ca:80'},{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'turn:global.relay.metered.ca:80',username:'ba88079176616565ef57f408',credential:'2sorAbF4hI8eMjGO'},{urls:'turn:global.relay.metered.ca:80?transport=tcp',username:'ba88079176616565ef57f408',credential:'2sorAbF4hI8eMjGO'},{urls:'turn:global.relay.metered.ca:443',username:'ba88079176616565ef57f408',credential:'2sorAbF4hI8eMjGO'},{urls:'turns:global.relay.metered.ca:443?transport=tcp',username:'ba88079176616565ef57f408',credential:'2sorAbF4hI8eMjGO'}]};
function setStatus(t){statusEl.textContent=t}function send(d){if(conn&&conn.open)conn.send(Object.assign({player},d))}
function render(s){lastState=s||lastState;answer.classList.remove('show');const pp=document.getElementById('phonePuzzle'),phrase=document.getElementById('phonePhrase'),cat=document.getElementById('phoneCategory'),adv=document.getElementById('advantages');if(lastState.puzzle){pp.classList.add('show');phrase.textContent=lastState.puzzle;cat.textContent=lastState.category||'PUZZLE'}else pp.classList.remove('show');const held=(lastState.advantages&&lastState.advantages[player])||[];adv.innerHTML=held.map(x=>`<span class="adv">${String(x).replace(/[<>&]/g,'')}</span>`).join('');if(lastState.armed){control.disabled=false;control.textContent='BUZZ IN';setStatus('Toss-up is live — buzz when you know it!');control.dataset.action='buzz'}else if(lastState.spinEnabled&&lastState.activePlayer===player){control.disabled=false;control.textContent='SPIN THE WHEEL';setStatus('It is your turn!');control.dataset.action='spin'}else{control.disabled=true;control.textContent=lastState.activePlayer===player?'WAIT':'NOT YOUR TURN';setStatus(lastState.status||'Wait for the host');control.dataset.action=''}}
function handleMessage(d){
 if(!d||typeof d!=='object')return;
 if(d.type==='state'&&player>=0)render(d);
 if(d.type==='pool-confirmed'){setStatus('You are in the contestant pool! Please do not close this window.');document.getElementById('signupBtn').disabled=true;document.getElementById('signupName').disabled=true}
 if(d.type==='selected'){player=Number(d.player);playerName=d.playerName||`Player ${player+1}`;color=d.color||color;poolMode=false;document.documentElement.style.setProperty('--c',color);document.getElementById('name').textContent=playerName;signup.classList.remove('show');control.style.display='flex';send({type:'hello'});setStatus('You were selected! Stay on this screen.')}
 if(d.type==='not-selected'){signup.classList.remove('show');control.style.display='none';document.getElementById('name').textContent='THANK YOU';setStatus('Sorry, you were not chosen this round. Please try again next round. Keep this window open.')}
 if(d.type==='pool-reopened'){poolMode=true;player=-1;signup.classList.remove('show');control.style.display='none';document.getElementById('name').textContent='NEXT ROUND';setStatus('You are eligible for the next draw. Please keep this window open.')}
 if(d.type==='answer-prompt'&&d.player===player){control.disabled=true;answer.classList.add('show');document.getElementById('answerText').focus();setStatus('Type your answer, then send it.')}
 if(d.type==='answer-clear'){answer.classList.remove('show');render(lastState)}
 if(d.type==='special-notice'){document.getElementById('noticeKicker').textContent=d.kicker||'SPECIAL WEDGE';document.getElementById('noticeTitle').textContent=d.title||'';document.getElementById('noticeCopy').textContent=d.copy||'';document.getElementById('phoneNotice').classList.add('show')}
 if(d.type==='special-clear')document.getElementById('phoneNotice').classList.remove('show');
 if(d.type==='bonus-prize-prompt'&&d.player===player){document.getElementById('bonusWheel').classList.add('show');document.getElementById('bonusSpin').disabled=false}
 if(d.type==='bonus-prize-result'){const disc=document.getElementById('bonusDisc');disc.textContent='$'+Number(d.prize||0).toLocaleString();setTimeout(()=>document.getElementById('bonusWheel').classList.remove('show'),2200)}
}
function connect(){if(!room){join.classList.add('show');control.style.display='none';setStatus('Room code needed');return}join.classList.remove('show');if(poolMode&&player<0){signup.classList.add('show');control.style.display='none';document.getElementById('name').textContent='SIGN UP';setStatus('Connecting to the contestant pool…')}else{control.style.display='flex';setStatus('Connecting…')}if(typeof Peer==='undefined'){setStatus('Controller could not load. Check your internet and refresh.');return}let ready=false;const timer=setTimeout(()=>{if(!ready)setStatus('Still connecting. Keep this page open, verify the room code, then refresh once.')},12000);const peer=new Peer(undefined,{debug:0,config:rtc});peer.on('open',()=>{conn=peer.connect('wheel-'+room,{reliable:true});conn.on('open',()=>{ready=true;clearTimeout(timer);if(player>=0)send({type:'hello'});setStatus(poolMode&&player<0?'Connected — enter your name below.':'Connected — waiting for the host')});conn.on('data',handleMessage);conn.on('close',()=>{setStatus('Disconnected — reconnecting…');setTimeout(()=>location.reload(),2500)});conn.on('error',()=>setStatus('Connection interrupted. Refresh once to reconnect.'))});peer.on('error',err=>{clearTimeout(timer);setStatus(err&&err.type==='peer-unavailable'?'The host room is not ready. Ask the host to reopen Phone Buzzers, then refresh.':'Could not connect. Check the room code and internet, then refresh once.')});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&peer.disconnected&&!peer.destroyed){try{peer.reconnect()}catch(_){}}})}
control.onclick=()=>{const a=control.dataset.action;if(!a)return;control.disabled=true;send({type:a});if(navigator.vibrate)navigator.vibrate(80)};
document.getElementById('sendAnswer').onclick=()=>{const input=document.getElementById('answerText');send({type:'game-answer',answer:input.value});input.value='';answer.classList.remove('show');setStatus('Answer sent — waiting for host')};
document.getElementById('joinBtn').onclick=()=>{room=document.getElementById('room').value.trim().toUpperCase();if(room.length===4)connect()};connect();
document.getElementById('signupBtn').onclick=()=>{signupName=document.getElementById('signupName').value.trim();if(!signupName){setStatus('Please enter your name.');return}let token='';try{token=localStorage.getItem('wheelPoolToken')||'';if(!token){token='guest-'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('wheelPoolToken',token)}}catch(_){token='guest-'+Math.random().toString(36).slice(2)}send({type:'pool-signup',name:signupName,token});setStatus('Adding your name…')};
document.getElementById('bonusSpin').onclick=()=>{const b=document.getElementById('bonusSpin'),disc=document.getElementById('bonusDisc');b.disabled=true;disc.classList.remove('spin');void disc.offsetWidth;disc.classList.add('spin');disc.textContent='SPINNING';send({type:'bonus-prize-spin'})};
</script></body></html>
