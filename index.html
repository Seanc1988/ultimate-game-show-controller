<style>
:root{--c:#27d9ff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#050b1d;color:#fff;font-family:Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at top,#183767 0,#071126 60%,#02050d 100%)}button,input{font:inherit}.app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(540px,100%);text-align:center}.logo{width:min(250px,65vw);height:auto;margin:0 auto 8px}.eyebrow{font-size:13px;font-weight:1000;letter-spacing:3px;color:#ffd34d}.name{font-size:clamp(34px,10vw,58px);font-weight:1000;color:var(--c);text-transform:uppercase;margin:6px 0}.status{min-height:48px;color:#cbd8f5;font-size:17px;line-height:1.25}.panel{display:none}.panel.show{display:block}.join input,.signup input{width:100%;padding:16px;border-radius:13px;border:2px solid var(--c);background:#08112a;color:#fff;text-align:center;font-size:28px;font-weight:900;letter-spacing:6px;text-transform:uppercase}.signup input{letter-spacing:0;text-transform:none;font-size:22px}.primary.show{display:block!important}.primary{width:100%;padding:16px;border:0;border-radius:13px;background:linear-gradient(135deg,#27d9ff,#1463ff);color:#041126;font-weight:1000;font-size:19px;margin-top:10px}.secondary{width:100%;padding:13px;border:1px solid #536a99;border-radius:12px;background:#13203e;color:#fff;font-weight:900;margin-top:9px}.hint{font-size:14px;color:#aebbd9;line-height:1.35;margin:10px 0}.code-badge{font-size:clamp(42px,13vw,72px);font-weight:1000;letter-spacing:12px;color:#ffd34d;text-shadow:0 0 25px #ffd34d;margin:10px 0}.pool-note{padding:12px;border:1px solid #ffd34d66;border-radius:12px;color:#fff2a8;background:#ffd34d0e}.avatar{width:86px;height:86px;margin:10px auto;border:4px solid var(--c);border-radius:50%;display:grid;place-items:center;overflow:hidden;background:#111b38;font-size:44px}.avatar img{width:100%;height:100%;object-fit:cover}.avatars{display:flex;gap:7px;justif eg 300deg,#ff7042 300deg 360deg);box-shadow:0 0 45px #27d9ff88}.phone-wheel-disc:after{content:'';position:absolute;inset:15%;border-radius:50%;background:#091436}.phone-wheel-logo{position:absolute;z-index:3;inset:24%;width:52%;height:52%;object-fit:contain}.phone-wheel-pointer{position:absolute;z-index:5;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-top:42px solid #fff;filter:drop-shadow(0 3px 3px #000)}.phone-wheel-copy{position:absolute;z-index:6;left:0;right:0;bottom:-3px;color:#ffd34d;font-weight:1000;letter-spacing:2px;text-shadow:0 2px 4px #000}.notice,.selection,.bonus{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;padding:20px;background:#020510f5}.notice.show,.selection.show,.bonus.show{display:flex}.notice-card,.selection-card,.bonus-card{width:min(520px,100%);padding:28px 20px;border:4px solid #ffd34d;border-radius:24px;background:radial-gradient(circle at top,#263f82,#090d28 72%);box-shadow:0 0 50px #000}.notice-title,.selection-title{font-size:clamp(38px,11vw,64px);font-weight:1000;color:#ffd34d;line-height:.95;margin:12px 0}.notice-copy,.selection-copy{font-size:20px;line-height:1.3}.selected{background:#063d1c}.not-selected{background:#500b16}.bonus-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bonus-grid button{min-height:72px;border:3px solid #ffd34d;border-radius:10px;background:#8c248d;color:#fff;font-weight:1000;font-size:22px}.actions{display:grid;gap:8px;margin-top:10px}.hidden{display:none!important}
</style></head><body><main class="app"><section class="card">
<img class="logo" src="ultimate-game-show-live-logo.png" alt="Ultimate Game Show Live"><div class="eyebrow">LIVE GAME CONTROLLER</div><div class="name" id="name">CONTESTANT</div><div class="status" id="status">Enter the game code to begin.</div>
<section id="join" class="panel show"><div class="hint">Scan the host's QR code, or enter the 5-letter game code.</div><div class="code-badge" id="joinCodeDisplay">-----</div><input id="room" maxlength="5" inputmode="latin" autocomplete="one-time-code" placeholder="ABCDE"><button class="primary" id="joinBtn">JOIN GAME</button></section>
<section id="signup" class="panel"><div class="pool-note"><b>CONTESTANT SIGN-UP</b><br>Enter your name below. Keep this page open after joining.</div><input id="signupName" maxlength="30" autocomplete="name" placeholder="YOUR NAME"><div class="avatar" id="avatarPreview">⭐</div><div class="avatars"><button data-avatar="⭐">⭐</button><button data-avatar="🦊">🦊</button><button data-avatar="🦁">🦁</button><button data-avatar="🐼">🐼</button><button data-avatar="🎤">🎤</button></div><label class="file">📷 TAKE OR UPLOAD PHOTO<input id="avatarPhoto" type="file" accept="image/*" capture="user"></label><button class="primary" id="signupBtn">JOIN CONTESTANT POOL</button></section>
<div class="advantages" id="advantages"></div><button id="wildButton" class="primary hidden" type="button">🃏 USE WILD CARD</button><div class="phone-puzzle" id="phonePuzzle"><div class="cat" id="phoneCategory"></div><div class="phrase" id="phonePhrase"></div></div>
<div id="answerBox" class="panel"><input id="answerText" maxlength="120" placeholder="TYPE YOUR ANSWER"><button class="primary" id="answerSend" type="button">SEND ANSWER</button></div><button id="control" class="control" type="button" disabled>WAIT</button><button id="phoneWheel" class="phone-wheel" type="button"><span class="phone-wheel-pointer"></span><span class="phone-wheel-disc" id="phoneWheelDisc"></span><img class="phone-wheel-logo" src="ultimate-game-show-live-logo.png" alt=""><span class="phone-wheel-copy">TAP TO SPIN</span></button>
<div class="actions"><button class="secondary" id="reconnectBtn">↻ RECONNECT</button><button class="secondary" id="newGameBtn">DISCONNECT / JOIN NEW GAME</button></div>
</section></main>
<div class="notice" id="notice"><div class="notice-card"><div class="eyebrow" id="noticeKicker"></div><div class="notice-title" id="noticeTitle"></div><div class="notice-copy" id="noticeCopy"></div></div></div>
<div class="selection" id="selection"><div class="selection-card" id="selectionCard"><div class="selection-title" id="selectionTitle"></div><div class="selection-copy" id="selectionCopy"></div></div></div>
<div class="bonus" id="bonus"><div class="bonus-card"><div class="eyebrow">PICK A MYSTERY BONUS CARD</div><div class="bonus-grid" id="bonusGrid"></div></div></div>
<script src="peerjs.min.js?v=49"></script><script>
(function(){
'use strict';
const RTC={iceServers:[{urls:'stun:stun.relay.metered.ca:80'},{urls:'stun:stun.l.google.com:19302'},{urls:'turn:global.relay.metered.ca:80',username:'ba88079176616565ef57f408',credential:'2sorAbF4hI8eMjGO'},{urls:'turn:global.relay.metered.ca:443',username:'ba88079176616565ef57f408',credential:'2sorAbF4hI8eMjGO'},{urls:'turns:global.relay.metered.ca:443?transport=tcp',username:'ba88079176616565ef57f408',credential:'2sorAbF4hI8eMjGO'}]};
const $=id=>document.getElementById(id), join=$('join'),signup=$('signup'),control=$('control'),wheel=$('phoneWheel'),status=$('status');
const q=new URLSearchParams(location.search);let room=String(q.get('room')||'').toUpperCase();let joinCode=String(q.get('code')||'').toUpperCase();let sessionId=q.get('sid')||'';let poolMode=q.get('mode')==='pool';let player=q.has('p')?Number(q.get('p')):(poolMode?-1:-1);let playerName=q.get('name')||'CONTESTANT';let color=q.get('color')||'#27d9ff';let bindToken=q.get('bind')||'';let selectedLocked=false;let signupName='',avatarValue='⭐';let peer=null,conn=null,retry=0,retryTimer=null,heartbeat=null,watchdog=null,generation=0,manual=false,lastHost=Date.now(),lastState={},wheelBusy=false;
try{signupName=localStorage.getItem('wheelPoolName')||'';avatarValue=localStorage.getItem('wheelPoolAvatar')||'⭐'}catch(_){}
try{const saved=JSON.parse(localStorage.getItem('ugsControllerBindingV49')||'null');if(saved&&saved.code===joinCode&&saved.sessionId===sessionId&&Number.isInteger(saved.player)){player=saved.player;playerName=saved.playerName||playerName;color=saved.color||color;bindToken=saved.bindToken||bindToken;selectedLocked=!!saved.selectedLocked;poolMode=false}}catch(_){}
$('joinCodeDisplay').textContent=joinCode||'-----';document.documentElement.style.setProperty('--c',color);$('name').textContent=playerName;
function setStatus(x){status.textContent=x}
function clean(){clearTimeout(retryTimer);clearInterval(heartbeat);clearInterval(watchdog);heartbeat=watchdog=null;try{if(conn)conn.close()}catch(_){}try{if(peer)peer.destroy()}catch(_){}conn=null;peer=null}
function save(){try{localStorage.setItem('ugsControllerBindingV49',JSON.stringify({code:joinCode,sessionId,player,playerName,color,bindToken,selectedLocked}))}catch(_){} }
function clearControllerStorage(){try{Object.keys(localStorage).filter(k=>/^wheel|^ugsControllerBindingV49$/.test(k)).forEach(k=>localStorage.removeItem(k));sessionStorage.clear()}catch(_){} }
async function freshLanding(){manual=true;clean();clearControllerStorage();try{if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(_){}try{const rs=await navigator.serviceWorker?.getRegistrations?.()||[];await Promise.all(rs.map(r=>r.unregister()))}catch(_){}const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('fresh',Date.now().toString(36));location.replace(u.toString())}
function send(type,payload){if(!conn||!conn.open)return false;const msg=Object.assign({type:String(type).toLowerCase(),protocolVersion:49,code:joinCode,room,sessionId,player,bindToken},payload||{});try{conn.send(msg);return true}catch(_){return false}}
function connect(force){if(!room||!joinCode){join.classList.add('show');signup.classList.remove('show');control.style.display='none';wheel.classList.remove('show');setStatus('Scan the new QR code or enter the 5-letter game code.');return}if(!force&&conn?.open)return;const gen=++generation;manual=false;clean();join.classList.remove('show');if(poolMode&&player<0){signup.classList.add('show');control.style.display='none';wheel.classList.remove('show');$('name').textContent='SIGN UP'}else{signup.classList.remove('show');if(!selectedLocked)control.style.display='flex'}setStatus('Connecting to host…');if(typeof Peer==='undefined'){setStatus('Controller library did not load. Tap Reconnect.');$('reconnectBtn').classList.remove('hidden');return}let opened=false;peer=new Peer(undefined,{debug:0,config:RTC});const timeout=setTimeout(()=>{if(!opened&&gen===generation){setStatus('Host connection timed out. Retrying…');schedule(gen)}},10000);peer.on('open',()=>{if(gen!==generation)return;conn=peer.connect('wheel-'+room,{reliable:true,serialization:'json'});conn.on('open',()=>{if(gen!==generation)return;opened=true;clearTimeout(timeout);retry=0;$('reconnectBtn').classList.add('hidden');lastHost=Date.now();if(player>=0)send('hello',{player,bindToken});else if(poolMode)sendPool();heartbeat=setInterval(()=>send('ping',{ts:Date.now()}),6000);watchdog=setInterval(()=>{if(Date.now()-lastHost>22000){setStatus('Connection lost. Reconnecting…');schedule(gen)}},4000);setStatus(poolMode&&player<0?'Connected — enter your name below.':selectedLocked?'Selected — go to the host.':'Connected — waiting for the host')});conn.on('data',handle);conn.on('close',()=>{if(gen===generation&&!manual){setStatus('Disconnected — reconnecting…');schedule(gen)}});conn.on('error',()=>{if(gen===generation&&!manual){setStatus('Connection error — reconnecting…');schedule(gen)}})});peer.on('error',e=>{clearTimeout(timeout);if(gen!==generation)return;setStatus(e?.type==='peer-unavailable'?'Host is not ready. Retrying…':'Could not connect. Retrying…');schedule(gen)});peer.on('disconnected',()=>{if(gen===generation&&!manual)try{peer.reconnect()}catch(_){schedule(gen)}})}
function schedule(gen){if(manual||gen!==generation)return;clearTimeout(retryTimer);$('reconnectBtn').classList.remove('hidden');const delay=Math.min(9000,700*Math.pow(1.55,retry++))+Math.random()*300;retryTimer=setTimeout(()=>connect(true),delay)}
function poolToken(){let t='';const key='wheelPoolToken:'+sessionId;try{t=localStorage.getItem(key)||'';if(!t){t='guest-'+cryptoRandom();localStorage.setItem(key,t)}}catch(_){t='guest-'+cryptoRandom()}return t}
function cryptoRandom(){try{return crypto.getRandomValues(new Uint32Array(2)).join('')}catch(_){return Date.now().toString(36)+Math.random().toString(36).slice(2)}}
function sendPool(){return send('pool-signup',{name:signupName,token:poolToken(),avatar:avatarValue})}
function buzz(p){try{navigator.vibrate?.(p)}catch(_){} }
function renderBoard(rows,el){el.innerHTML='';el.className='phrase board-grid';(rows||[]).forEach(row=>{const r=document.createElement('div');r.className='phone-board-row';row.forEach(c=>{const x=document.createElement('div');x.className='phone-board-cell'+(c.revealed?' revealed':'');x.textContent=c.char||'';r.appendChild(x)});el.appendChild(r)})}
function render(s){lastState=s||{};if(s.sessionId&&sessionId&&s.sessionId!==sessionId)return;if(player<0)return;if(s.gameStarted&&selectedLocked){selectedLocked=false;save();$('selection').classList.remove('show')}if(selectedLocked)return;const pp=$('phonePuzzle'),ph=$('phonePhrase');if(s.puzzle){pp.classList.add('show');if(s.boardRows?.length)renderBoard(s.boardRows,ph);else{ph.className='phrase';ph.textContent=s.puzzle}$('phoneCategory').textContent=s.category||'PUZZLE'}else pp.classList.remove('show');const isTurn=player===Number(s.activePlayer),canSpin=!!s.spinEnabled&&isTurn&&!s.armed;wheel.classList.toggle('show',canSpin);control.style.display=canSpin?'none':'flex';const wc=Array.isArray(s.wildCardCounts)?Number(s.wildCardCounts[player]||0):0;$('advantages').innerHTML=(s.advantages?.[player]||[]).map(x=>'<span class="adv">'+String(x).replace(/[<>&]/g,'')+'</span>').join('');$('control').disabled=!s.armed||Number(s.winnerIdx)>=0;$('control').textContent=s.winnerIdx===player?'YOU BUZZED FIRST':s.winnerIdx>=0?'ANOTHER PLAYER BUZZED':s.excluded?.includes(player)?'LOCKED OUT':s.armed?'BUZZ IN':isTurn?'WAIT':'NOT YOUR TURN';$('control').dataset.action=s.armed&&s.winnerIdx==null&&!s.excluded?.includes(player)?'BUZZ':'';if(canSpin)setStatus('YOUR TURN — TAP THE WHEEL TO SPIN');else if(s.armed)setStatus('TOSS-UP LIVE — BUZZ WHEN YOU KNOW IT');else setStatus(s.status||'Waiting for the host');
const wild=$('wildButton');if(wild){wild.classList.toggle('show',isTurn&&wc>0);wild.disabled=!!s.canGuess||s.wildArmedPlayer===player}}
function handle(d){if(!d||typeof d!=='object')return;lastHost=Date.now();const type=String(d.type||'').toUpperCase();if(type==='PING'){send('pong',{ts:d.ts||Date.now()});return}if(type==='PONG')return;if(type==='HOST_ROOM_RESET'||type==='SESSION_RESET'){freshLanding();return}if(type==='ACK'){if(d.sessionId)sessionId=d.sessionId;if(d.bindToken)bindToken=d.bindToken;save();setStatus(selectedLocked?'Selected — go to the host.':'Connected — waiting for the host');return}if(type==='STATE'){render(d);return}if(type==='SPIN_ACCEPTED'){wheelBusy=false;wheel.classList.remove('show');setStatus('Wheel is spinning on the main screen!');return}if(type==='SPIN_REJECTED'){wheelBusy=false;render(lastState);setStatus(d.reason||'The host is not accepting a spin yet.');return}if(type==='POOL_CONFIRMED'){if(d.sessionId)sessionId=d.sessionId;save();$('signupBtn').disabled=true;$('signupName').disabled=true;setStatus('You are in the contestant pool. Keep this page open.');return}if(type==='SELECTED'){player=Number(d.player);playerName=d.playerName||('Player '+(player+1));color=d.color||color;bindToken=d.bindToken||bindToken;avatarValue=d.avatar||avatarValue;sessionId=d.sessionId||sessionId;poolMode=false;selectedLocked=true;document.documentElement.style.setProperty('--c',color);$('name').textContent=playerName;signup.classList.remove('show');control.style.display='none';wheel.classList.remove('show');save();send('hello',{player,bindToken});showSelection(true);return}if(type==='NOT_SELECTED'){showSelection(false);return}if(type==='POOL_REOPENED'){player=-1;poolMode=true;selectedLocked=false;signup.classList.add('show');control.style.display='none';wheel.classList.remove('show');$('name').textContent='SIGN UP';setStatus('You can enter the next draw.');return}if(type==='GAME_INTRO'){selectedLocked=false;save();$('selection').classList.remove('show');setStatus('The show is starting!');return}if(type==='ANSWER_PROMPT'&&d.player===player){$('control').disabled=true;$('answerBox').classList.add('show');setStatus('Type your answer and send it.');return}if(type==='ANSWER_CLEAR'){$('answerBox').classList.remove('show');return}if(type==='SPECIAL_NOTICE'){buzz([120,60,120]);showNotice(d.kicker,d.title,d.copy);return}if(type==='SPECIAL_CLEAR'){$('notice').classList.remove('show');return}if(type==='BONUS_CARD_PROMPT'&&d.player===player){showBonus(d.labels||[]);return}if(type==='BONUS_PRIZE_RESULT'&&d.player===player){showNotice('BONUS RESULT','$'+Number(d.prize||0).toLocaleString(),'');return}if(type==='BONUS_PRIZE_SEALED'){$('bonus').classList.remove('show');return}if(type==='KICKED'){freshLanding();return}}
function showSelection(ok){const el=$('selection');el.className='selection show '+(ok?'selected':'not-selected');$('selectionTitle').textContent=ok?'YOU ARE PLAYER '+(player+1):'NOT SELECTED';$('selectionCopy').textContent=ok?'Please make your way to the host to take your spot.':'Thanks for playing! You can try again next round.';buzz(ok?[500,180,500,180,500]:[180,70,180])}
function showNotice(k,t,c){$('noticeKicker').textContent=k||'';$('noticeTitle').textContent=t||'';$('noticeCopy').textContent=c||'';$('notice').classList.add('show')}
function showBonus(labels){const g=$('bonusGrid');g.innerHTML='';labels.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x;b.onclick=()=>{g.querySelectorAll('button').forEach(z=>z.disabled=true);send('bonus-card-pick',{card:i});setStatus('Card selected — waiting for the host.')} ;g.appendChild(b)});$('bonus').classList.add('show')}
function spin(){if(wheelBusy||!conn?.open||!lastState.spinEnabled||Number(lastState.activePlayer)!==player)return;wheelBusy=true;buzz([100,50,100]);const ok=send('spin',{gestureId:cryptoRandom(),velocity:0,duration:5200,turns:5,fallback:true});if(!ok){wheelBusy=false;connect(true);return}wheel.classList.remove('show');setStatus('Spin sent to host…')}
$('joinBtn').onclick=()=>{const code=$('room').value.trim().toUpperCase().replace(/[^A-Z]/g,'');if(code.length<4||code.length>5){setStatus('Enter the 4–5 letter game code shown by the host.');return}clearControllerStorage();room=code;joinCode=code;sessionId='';player=-1;bindToken='';selectedLocked=false;poolMode=true;$('joinCodeDisplay').textContent=code;connect(true)};
$('signupBtn').onclick=()=>{signupName=$('signupName').value.trim();if(!signupName){setStatus('Please enter your name.');return}try{localStorage.setItem('wheelPoolName',signupName);localStorage.setItem('wheelPoolAvatar',avatarValue)}catch(_){}if(sendPool())setStatus('Joining contestant pool…');else setStatus('Reconnecting to host…')};
$('control').onclick=()=>{if($('control').dataset.action==='BUZZ')send('buzz',{clientTs:Date.now()})};$('answerSend').onclick=()=>{const v=$('answerText').value.trim();if(!v)return;if(send('game-answer',{answer:v})){$('answerText').value='';$('answerBox').classList.remove('show');setStatus('Answer sent — waiting for host.')}};wheel.onclick=e=>{e.preventDefault();spin()};$('reconnectBtn').onclick=()=>{retry=0;connect(true)};$('wildButton').onclick=()=>{if(send('use-wild'))setStatus('Wild Card armed — call a consonant to the host.');};$('newGameBtn').onclick=()=>{if(confirm('Disconnect and clear this phone so it can join a new game?'))freshLanding()};
document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{avatarValue=b.dataset.avatar;$('avatarPreview').textContent=avatarValue});$('avatarPhoto').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),sc=Math.max(256/img.width,256/img.height),w=img.width*sc,h=img.height*sc;x.drawImage(img,(256-w)/2,(256-h)/2,w,h);avatarValue=c.toDataURL('image/jpeg',.72);$('avatarPreview').innerHTML='<img src="'+avatarValue+'" alt="">'};img.src=r.result};r.readAsDataURL(f)};
if(room&&joinCode){connect(false)}else{join.classList.add('show');setStatus('Scan the host QR code or enter the 5-letter game code.')}
})();
</script></body></html>
